[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-system-v2"
version = "0.1.0"
description = "Clean-room XAUUSD strategy knowledge and validation system"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xauusd-v2-ingest-mt5 = "xauusd_v2.mt5_history_cli:main"
xauusd-v2-replay-readiness = "xauusd_v2.replay_readiness_cli:main"
xauusd-v2-anthropic-runner = "xauusd_v2.anthropic_model_runner:main"
xauusd-v2-agent06-packet = "xauusd_v2.agent06_packet_cli:main"
xauusd-v2-agent06-readiness = "xauusd_v2.agent06_readiness_cli:main"
xauusd-v2-agent06-run = "xauusd_v2.agent06_run_cli:main"
xauusd-v2-agent06-compare = "xauusd_v2.agent06_compare_cli:main"
xauusd-v2-agent06-local = "xauusd_v2.agent06_local_cli:main"
xauusd-v2-agent06-audit = "xauusd_v2.agent06_audit_v2_cli:main"
xauusd-v2-agent06-review = "xauusd_v2.agent06_review_cli:main"
xauusd-v2-agent06-locator-review = "xauusd_v2.agent06_locator_set_review_cli:main"
xauusd-v2-risk-policy-check = "xauusd_v2.risk_policy_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
