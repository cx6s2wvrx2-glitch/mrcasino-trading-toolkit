name: XAUUSD V2 Tests

on:
  push:
    branches: [xauusd-v2-foundation]
    paths:
      - "xauusd-system-v2/**"
      - ".github/workflows/xauusd-v2-tests.yml"
  pull_request:
    paths:
      - "xauusd-system-v2/**"
      - ".github/workflows/xauusd-v2-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install V2 package
        run: python -m pip install -e ./xauusd-system-v2

      - name: Run V2 tests
        run: python -m unittest discover -s xauusd-system-v2/15_tests -p "test_*.py" -v
